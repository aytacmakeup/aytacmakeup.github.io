<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aytacmakeup — Catálogo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F2EA; --warm:#FFFDF8; --plum:#4B1F3F; --plum-soft:#F6EAF2; --espresso:#2E1B18;
  --gold:#C9A66B; --rose:#D9B7B0; --rose-deep:#A0705F; --confirm:#2FA66A; --danger:#B3402F;
  --whatsapp:#25D366; --muted:#8C7A74;
  /* alias de nombres anteriores para no romper estilos en línea */
  --ink:var(--espresso); --ink-soft:#6B5A54; --ink2:var(--plum); --yellow:var(--gold);
  --green:var(--confirm); --red:var(--danger); --border:#E8D9D3; --bg:var(--ivory); --card:var(--warm); --chip:#F1E8E0;
  --serif:'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'DM Sans','Inter','Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 10px 30px rgba(46,27,24,.08);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:var(--sans);background:var(--ivory);color:var(--espresso);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent;}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;}
button,input,textarea,select{font-family:inherit;}
.hidden{display:none!important;}
.serif{font-family:var(--serif);}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);}

/* ---- barra superior ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(255,253,248,.96);backdrop-filter:blur(8px);z-index:5;border-top:3px solid var(--gold);border-bottom:1px solid var(--border);}
.store-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;}
.store-id{display:flex;align-items:center;gap:12px;min-width:0;}
.logo{width:46px;height:46px;border-radius:50%;background:var(--plum);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--serif);font-weight:700;font-size:22px;position:relative;flex-shrink:0;overflow:hidden;}
.logo img{width:100%;height:100%;object-fit:cover;display:block;}
.store-meta{min-width:0;}
.store-name{font-size:17px;font-weight:700;margin:0;line-height:1.15;color:var(--espresso);}
.hours-row{display:flex;align-items:center;gap:6px;padding:0;margin-top:2px;color:var(--confirm);font-size:12.5px;font-weight:600;}
.hours-row:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
.hours-row svg{display:none;}
.hours-row.closed{color:var(--danger);}
.icon-btn{background:var(--warm);border:1.5px solid var(--plum);border-radius:14px;width:44px;height:44px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--plum);}
.badge{position:absolute;top:-7px;right:-7px;background:var(--gold);color:var(--espresso);font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--warm);}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;color:#fff;padding:52px 22px 44px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(120% 90% at 85% 10%,#7d3a68 0%,rgba(75,31,63,0) 60%),linear-gradient(160deg,#5b2749 0%,#3a1530 100%);}
.hero.has-img{background-size:cover;background-position:center;}
.hero.has-img:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(75,31,63,.55),rgba(46,27,24,.85));}
.hero-deco{position:absolute;right:-70px;top:30px;width:290px;height:290px;border-radius:50%;border:1px solid rgba(201,166,107,.45);}
.hero-deco:before{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(201,166,107,.28);}
.hero-deco:after{content:'✦';position:absolute;left:38px;top:58px;color:var(--gold);font-size:22px;}
.hero-spark{position:absolute;right:46px;top:120px;color:var(--gold);font-size:13px;}
.hero > :not(.hero-deco):not(.hero-spark){position:relative;}
.hero .eyebrow{color:var(--gold);margin-bottom:14px;}
.hero h2{font-family:var(--serif);font-size:34px;line-height:1.12;font-weight:600;margin:0 0 12px;max-width:300px;}
.hero p{font-size:16px;line-height:1.5;margin:0 0 24px;max-width:290px;color:rgba(255,253,248,.88);}
.hero-btn{width:52px;height:38px;border-radius:999px;border:none;background:var(--gold);color:var(--espresso);display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* ---- sección catálogo ---- */
.section-head{padding:38px 20px 6px;}
.section-head h2{font-family:var(--serif);font-size:26px;font-weight:600;margin:8px 0 6px;color:var(--espresso);}
.section-head .count{font-size:13px;color:var(--muted);}
.filter-card{margin:18px 16px 8px;background:var(--warm);border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:var(--shadow);position:relative;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{width:100%;height:46px;padding:0 16px 0 44px;border:1px solid var(--rose);border-radius:999px;font-size:14.5px;background:var(--ivory);color:var(--espresso);outline:none;}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,166,107,.28);}
.search-wrap input::placeholder{color:var(--muted);}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--plum);}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px;border-bottom:1px solid var(--border);}
.pill{padding:9px 18px;border-radius:999px;border:1px solid var(--rose);background:var(--warm);color:var(--espresso);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--plum);border-color:var(--plum);color:#fff;}
.controls-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;gap:10px;position:relative;}
.sort-label{font-size:14px;font-weight:700;color:var(--espresso);white-space:nowrap;}
.sort-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--rose);background:var(--warm);color:var(--espresso);font-size:13.5px;cursor:pointer;}
.sort-btn svg{color:var(--plum);flex-shrink:0;}
.sort-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sort-menu{position:absolute;top:100%;left:72px;right:56px;margin-top:-2px;background:var(--warm);border:1px solid var(--rose);border-radius:16px;padding:6px;z-index:6;box-shadow:0 14px 30px rgba(46,27,24,.16);}
.sort-item{padding:11px 12px;font-size:14px;border-radius:10px;cursor:pointer;color:var(--espresso);}
.sort-item:hover,.sort-item.on{background:var(--plum-soft);}
.view-toggle{display:flex;border:1px solid var(--rose);border-radius:999px;overflow:hidden;flex-shrink:0;background:var(--warm);}
.view-btn{width:42px;height:40px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--plum);border:none;cursor:pointer;}
.view-btn.active{background:var(--plum);color:#fff;}

/* ---- productos ---- */
.products{padding:18px 16px 8px;scroll-margin-top:90px;}
.products.grid,.products.list{display:flex;flex-direction:column;gap:14px;}
.card{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--warm);display:flex;flex-direction:row;cursor:pointer;min-width:0;box-shadow:var(--shadow);}
.card-img{position:relative;width:36%;min-height:150px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.card-img svg{width:38%;height:38%;opacity:.92;}
.card-img img{position:absolute;inset:0;}
.badge-pill{position:absolute;top:10px;left:10px;z-index:1;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--gold);color:var(--espresso);letter-spacing:.02em;}
.badge-pill.off{background:var(--rose);color:var(--plum);}
.card-body{flex:1;min-width:0;padding:16px 16px 16px 18px;display:flex;flex-direction:column;gap:6px;}
.card-cat{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);}
.card-title{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--espresso);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px;}
.price{font-size:15.5px;font-weight:700;color:var(--plum);}
.add-btn{min-width:46px;height:34px;padding:0 14px;border-radius:999px;border:none;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;gap:5px;font-size:13px;font-weight:700;}
.add-btn.in-cart{background:var(--plum);color:var(--gold);}
.add-btn.agotado{background:#EFDDD8;color:var(--plum);cursor:not-allowed;pointer-events:none;font-weight:600;}
.card.is-agotado,.list-card.is-agotado{opacity:.85;}
.stock-pill{display:inline-block;background:#EFDDD8;color:var(--plum);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;align-self:flex-start;}
.card-img img,.list-img img,.detail-main-img img,.cart-img img,.thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;}
.list-card{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:16px;padding:10px;cursor:pointer;background:var(--warm);}
.list-img{width:64px;height:64px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;}
.list-img svg{width:40%;height:40%;}
.list-info{flex:1;min-width:0;}
.list-title{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--espresso);margin-bottom:3px;}
.list-price{font-size:14.5px;font-weight:700;color:var(--plum);}
.empty-state{text-align:center;padding:60px 24px;color:var(--muted);}
.empty-state svg{margin-bottom:12px;opacity:.5;}
.empty-state p{font-size:15px;font-weight:600;margin:0 0 16px;}

/* ---- atención cercana / pie ---- */
.care{margin-top:34px;background:var(--espresso);color:#fff;padding:40px 20px 30px;}
.care .eyebrow{color:var(--gold);}
.care h2{font-family:var(--serif);font-size:26px;font-weight:600;margin:10px 0 10px;line-height:1.2;}
.care p.lead{font-size:14.5px;line-height:1.55;color:rgba(255,253,248,.78);margin:0 0 22px;}
.care-card{background:var(--warm);color:var(--espresso);border-radius:22px;padding:18px;}
.care-row{padding:12px 0;border-bottom:1px solid var(--border);}
.care-row:first-child{padding-top:0;}
.care-row:last-of-type{border-bottom:none;}
.care-row .eyebrow{display:block;margin-bottom:4px;}
.care-row div.val{font-size:14px;font-weight:600;color:var(--espresso);word-break:break-word;}
.care-btns{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.care-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;border:1.5px solid var(--plum);color:var(--plum);background:transparent;}
.care-btn.solid{background:var(--plum);color:#fff;}
.care-btn svg{flex-shrink:0;}
.care-foot{text-align:center;padding:26px 8px 60px;font-size:13px;color:rgba(255,253,248,.7);line-height:1.7;}
.care-foot strong{display:block;font-family:var(--serif);font-size:15px;font-weight:600;color:#fff;margin-bottom:4px;}
.care-foot em{display:block;font-family:var(--serif);font-size:14.5px;color:var(--gold);margin-bottom:10px;}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--whatsapp);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;border:none;z-index:4;}

/* ---- detalle ---- */
.detail-header,.cart-header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(255,253,248,.96);backdrop-filter:blur(8px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px;}
.detail-header h1{font-family:var(--serif);font-size:18px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-header .left{display:flex;align-items:center;gap:12px;min-width:0;}
.back-btn{background:none;border:none;cursor:pointer;color:var(--plum);display:flex;padding:4px;flex-shrink:0;}
.detail-main-img{margin:16px;aspect-ratio:1/1;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;box-shadow:var(--shadow);}
.detail-main-img svg{width:32%;height:32%;}
.thumbs{display:flex;gap:10px;padding:0 16px 6px;}
.thumb{width:58px;height:58px;border-radius:14px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;overflow:hidden;}
.thumb.active{border-color:var(--gold);}
.thumb svg{width:40%;height:40%;}
.detail-body{padding:14px 18px 120px;}
.detail-price{font-family:var(--serif);font-size:28px;font-weight:600;margin:4px 0 10px;color:var(--plum);}
.detail-desc{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:20px;}
.variant-group{margin-bottom:18px;}
.variant-group-name{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-deep);margin-bottom:10px;}
.variant-options{display:flex;flex-wrap:wrap;gap:8px;}
.variant-pill{border:1px solid var(--rose);background:var(--warm);border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;color:var(--espresso);cursor:pointer;}
.variant-pill.selected{border-color:var(--plum);background:var(--plum);color:#fff;}
.variant-pill.disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed;}
.qty-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--rose);border-radius:16px;padding:6px;background:var(--warm);}
.qty-btn{width:42px;height:42px;border-radius:12px;border:none;background:var(--plum-soft);color:var(--plum);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qty-num{font-size:17px;font-weight:700;}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--plum);color:#fff;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:none;width:100%;border-top:1px solid var(--gold);z-index:6;}
.bottom-bar:disabled{cursor:not-allowed;}
.bottom-bar .left{display:flex;align-items:center;gap:12px;}
.qty-chip{background:rgba(255,255,255,.16);border:1px solid rgba(201,166,107,.6);border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px;}
.bottom-bar .label{font-weight:700;font-size:15px;}
.bottom-bar .right{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;font-size:17px;color:var(--gold);}

/* ---- carrito ---- */
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 20px 16px;border-bottom:1px solid var(--border);background:var(--warm);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;}
.sheet-head h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:6px 0 0;}
.close-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--rose);background:var(--warm);color:var(--espresso);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.cart-tools{display:flex;justify-content:flex-end;padding:10px 20px 0;}
.clear-link{color:var(--danger);font-size:13px;font-weight:600;text-decoration:underline;background:none;border:none;cursor:pointer;}
.cart-list{padding:14px 16px 250px;display:flex;flex-direction:column;gap:12px;}
.cart-item{border:1px solid var(--border);border-radius:20px;padding:16px;background:var(--warm);}
.cart-item .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.cart-info{min-width:0;}
.cart-info .name{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--espresso);line-height:1.25;margin-bottom:4px;}
.cart-info .price{font-size:14px;color:var(--ink-soft);}
.trash-btn{background:none;border:none;color:var(--rose-deep);cursor:pointer;padding:6px;display:flex;flex-shrink:0;}
.cart-item .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.mini-stepper{display:flex;align-items:center;gap:14px;border:1px solid var(--rose);border-radius:999px;padding:4px 10px;flex-shrink:0;background:var(--warm);}
.mini-btn{width:26px;height:30px;border:none;background:none;color:var(--espresso);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.mini-stepper span{font-weight:700;min-width:14px;text-align:center;}
.line-total{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--plum);}
.cart-footer{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--warm);border-top:1px solid var(--border);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));z-index:6;}
.subtotal-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
.subtotal-row .lbl{font-size:15px;font-weight:700;}
.subtotal-row .amt{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--plum);}
.cart-note{font-size:12.5px;color:var(--muted);margin:0 0 14px;}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:999px;border:none;background:var(--plum);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.cta:disabled{opacity:.5;cursor:not-allowed;}

/* ---- checkout ---- */
.page-head{display:flex;align-items:flex-start;gap:14px;padding:22px 20px 16px;border-bottom:1px solid var(--border);background:var(--warm);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;}
.page-head h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;line-height:1.15;}
.page-head .step{font-size:13px;font-weight:700;color:var(--rose-deep);margin-top:4px;}
.page-head .back-btn{margin-top:6px;}
.checkout-body{padding:18px 16px 130px;display:flex;flex-direction:column;gap:16px;}
.panel{background:var(--warm);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);}
.panel h2{font-size:17px;font-weight:700;margin:0 0 4px;}
.panel .sub{font-size:14px;color:var(--ink-soft);margin:0 0 16px;}
.delivery-opt{display:flex;align-items:center;gap:14px;border:1px solid var(--rose);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;background:var(--warm);}
.delivery-opt.selected{border-color:var(--plum);background:var(--plum-soft);box-shadow:0 0 0 3px rgba(201,166,107,.28);}
.delivery-opt.disabled{opacity:.55;cursor:not-allowed;}
.delivery-opt .radio{order:-1;}
.delivery-opt .left{display:flex;align-items:center;gap:14px;flex:1;}
.opt-icon{width:52px;height:52px;border-radius:50%;background:var(--plum-soft);color:var(--plum);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.delivery-opt.selected .opt-icon{background:var(--plum);color:#fff;}
.delivery-opt .txt strong{display:block;font-size:15.5px;font-weight:700;color:var(--espresso);}
.delivery-opt .txt span{font-size:12.5px;color:var(--danger);font-weight:600;}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.radio.on{border-color:var(--plum);}
.radio.on:after{content:'';width:11px;height:11px;border-radius:50%;background:var(--plum);}
.divider{height:1px;background:var(--border);margin:18px 0 4px;}
.field{margin:18px 0 0;}
.field label{font-size:14.5px;font-weight:700;display:block;margin-bottom:8px;}
.field label .req{color:var(--espresso);}
.field input,.field textarea{width:100%;padding:0 16px;height:50px;border:1px solid var(--rose);border-radius:14px;font-size:15px;color:var(--espresso);background:var(--warm);outline:none;}
.field input::placeholder,.field textarea::placeholder{color:#A8958E;}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,166,107,.28);}
.field input.err,.field textarea.err{border-color:var(--danger);}
.field textarea{resize:vertical;min-height:110px;padding:14px 16px;height:auto;}
.phone-row{display:flex;gap:10px;}
.flag-select{display:flex;align-items:center;gap:8px;border:1px solid var(--gold);border-radius:14px;padding:0 14px;flex-shrink:0;height:50px;background:var(--warm);font-size:15px;box-shadow:0 0 0 3px rgba(201,166,107,.2);}
.summary-line{padding:14px 0;border-bottom:1px solid var(--border);}
.summary-line:nth-last-child(2){border-bottom:none;}
.sl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.summary-line .nm{font-size:14.5px;color:var(--espresso);min-width:0;font-weight:500;}
.summary-line .nm small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;font-weight:400;}
.summary-line .amt{font-weight:700;font-size:14.5px;white-space:nowrap;}
.sl-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.remove-link{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;padding:6px 2px;}
.remove-link svg{width:16px;height:16px;}
.summary-total{display:flex;align-items:baseline;justify-content:space-between;padding-top:16px;margin-top:4px;border-top:1px solid var(--border);}
.summary-total .lbl{font-size:15px;font-weight:700;}
.summary-total .amt{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--plum);}
.panel-top{display:flex;align-items:center;justify-content:space-between;color:var(--gold);}
.panel-top .eyebrow{color:var(--rose-deep);}
.panel h2.serif{font-family:var(--serif);font-size:22px;font-weight:600;margin:6px 0 8px;}

/* ---- confirmación ---- */
.confirm-wrap{margin:56px 16px;padding:40px 24px 36px;text-align:center;background:var(--warm);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow);}
.confirm-check{width:84px;height:84px;border-radius:50%;background:var(--confirm);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:0 0 0 8px rgba(47,166,106,.14);}
.confirm-wrap h1{font-family:var(--serif);font-size:27px;font-weight:600;margin:0 0 10px;}
.confirm-wrap p{color:var(--ink-soft);font-size:15px;line-height:1.55;margin:0 0 26px;}
.primary-btn{background:var(--plum);color:#fff;border:none;border-radius:999px;padding:0 30px;height:50px;font-size:15px;font-weight:700;cursor:pointer;}

/* =====================================================================
   PANTALLAS MEDIANAS Y ESCRITORIO
   ===================================================================== */
@media (min-width:600px) and (max-width:959px){
  #app{max-width:640px;}
  .bottom-bar,.cart-footer{max-width:640px;}
  .card{flex-direction:column;}
  .products.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .card-img{width:100%;min-height:0;aspect-ratio:4/3;}
}
@media (min-width:960px){
  body{background:var(--ivory);padding:0 0 40px;}
  #app{max-width:1180px;}
  .topbar{border-radius:0;}
  .store-row{padding:14px 48px 10px;}
  .hero{min-height:460px;padding:80px 64px 64px;}
  .hero h2{font-size:52px;max-width:560px;}
  .hero p{font-size:19px;max-width:520px;}
  .hero-deco{right:6%;width:420px;height:420px;top:40px;}
  .section-head{padding:56px 48px 8px;}
  .section-head h2{font-size:32px;}
  .filter-card{margin:20px 48px 8px;}
  .pills{flex-wrap:wrap;}
  .sort-menu{left:96px;right:auto;min-width:240px;}
  .products{padding:24px 48px 44px;}
  .products.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;}
  .products.list{max-width:820px;}
  .card{flex-direction:column;transition:transform .22s ease,box-shadow .22s ease;}
  .card:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(46,27,24,.14);}
  .card-img{width:100%;min-height:0;aspect-ratio:4/3;}
  .card-title{font-size:17.5px;}
  .care{padding:64px 64px 30px;margin-top:48px;}
  .care h2{font-size:34px;max-width:560px;}
  .care-card{max-width:560px;}
  .fab{right:32px;bottom:32px;width:58px;height:58px;}
  .bottom-bar,.cart-footer{position:static;max-width:none;width:100%;margin:0;flex-direction:column;align-items:stretch;gap:14px;border-radius:22px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);}
  .bottom-bar{background:var(--plum);}
  .bottom-bar .left{width:100%;justify-content:space-between;}
  .bottom-bar .right{width:100%;justify-content:space-between;font-size:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);}
  body.view-detail #app{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;align-items:start;padding:0 48px 48px;}
  body.view-detail .detail-header{grid-column:1/3;grid-row:1;position:static;padding:28px 0 20px;}
  body.view-detail .detail-main-img{grid-column:1;grid-row:2;margin:32px 0 0;}
  body.view-detail .thumbs{grid-column:1;grid-row:3;padding:14px 0 0;}
  body.view-detail .detail-body{grid-column:2;grid-row:2/4;padding:32px 0 0;}
  body.view-detail .bottom-bar{grid-column:2;grid-row:4;margin-top:20px;align-self:start;}
  body.view-cart #app,body.view-checkout #app{display:grid;grid-template-columns:1.6fr 1fr;column-gap:40px;align-items:start;padding:0 48px 48px;}
  body.view-cart .sheet-head,body.view-checkout .page-head{grid-column:1/3;grid-row:1;position:static;margin:0 -48px;padding:28px 48px 20px;}
  body.view-cart .cart-tools{grid-column:1/3;grid-row:2;padding:12px 0 0;}
  body.view-cart .cart-list{grid-column:1;grid-row:3;padding:18px 0;}
  body.view-checkout .checkout-body{grid-column:1;grid-row:2;padding:26px 0;}
  body.view-cart .cart-footer{grid-column:2;grid-row:3;position:sticky;top:32px;margin-top:18px;}
  body.view-checkout .bottom-bar{grid-column:2;grid-row:2;position:sticky;top:32px;margin-top:26px;}
  body.view-cart .empty-state{grid-column:1/3;grid-row:3;}
  body.view-confirmation #app{display:flex;align-items:center;justify-content:center;min-height:640px;}
  .confirm-wrap{max-width:480px;margin:0;}
}

/* ---- portada con carrusel de imágenes ---- */
.hero.hero-slider{background:#F8F4EB;color:var(--plum);padding:0 0 30px;min-height:0;display:block;}
.hero-slider .hero-slides{position:relative;overflow:hidden;touch-action:pan-y;-webkit-mask-image:linear-gradient(#000 84%,transparent);mask-image:linear-gradient(#000 84%,transparent);}
.hero-slider .hero-track{display:flex;transition:transform .8s cubic-bezier(.65,0,.35,1);}
.hero-slider .hero-track img{flex:0 0 100%;width:100%;height:auto;display:block;aspect-ratio:1088/1344;object-fit:cover;}
.hero-slider .hero-dots{display:flex;justify-content:center;gap:2px;margin:-16px 0 14px;position:relative;}
.hero-slider .hero-dot{width:22px;height:22px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;}
.hero-slider .hero-dot:before{content:'';width:8px;height:8px;border-radius:99px;background:var(--rose);transition:width .3s,background .3s;}
.hero-slider .hero-dot.on:before{width:22px;background:var(--plum);}
.hero-slider .hero-dot:focus-visible{outline:2px solid var(--plum);outline-offset:1px;border-radius:99px;}
.hero-slider .hero-copy{padding:0 22px;position:relative;}
.hero-slider .hero-copy .eyebrow{color:var(--rose-deep);margin-bottom:12px;}
.hero-slider .hero-copy h2{color:var(--plum);}
.hero-slider .hero-copy p{color:var(--ink-soft);}
.hero-slider .hero-copy .hero-btn{background:var(--plum);color:var(--gold);}
@media (min-width:700px){
  .hero.hero-slider{display:grid;grid-template-columns:1fr minmax(320px,440px);align-items:center;gap:40px;padding:48px 64px;}
  .hero-slider .hero-media{order:2;}
  .hero-slider .hero-copy{order:1;padding:0;}
}

let heroIdx = 0, heroTimer = null, heroTouchX = null;
function heroGo(i, manual){
  heroIdx = (i + HERO_SLIDES.length) % HERO_SLIDES.length;
  const t = document.querySelector('.hero-track');
  if (t) t.style.transform = `translateX(-${heroIdx*100}%)`;
  document.querySelectorAll('.hero-dot').forEach((d,k)=>{ d.classList.toggle('on', k===heroIdx); d.setAttribute('aria-current', k===heroIdx?'true':'false'); });
  if (manual) heroRestart();
}
function heroRestart(){
  clearInterval(heroTimer);
  if (HERO_SLIDES.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches)
    heroTimer = setInterval(()=>heroGo(heroIdx+1), 5000);
}
document.addEventListener('touchstart', e=>{ heroTouchX = e.target.closest('.hero-slides') ? e.touches[0].clientX : null; }, {passive:true});
document.addEventListener('touchend', e=>{
  if (heroTouchX === null) return;
  const dx = e.changedTouches[0].clientX - heroTouchX; heroTouchX = null;
  if (Math.abs(dx) > 40) heroGo(heroIdx + (dx<0?1:-1), true);

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// Genera un color/ícono de reserva estable (según el id) para productos sin foto.
const FALLBACK_PALETTE = [
  {gradient:'linear-gradient(135deg,#FF6F91,#FF9A76)', icon:'lip'},
  {gradient:'linear-gradient(135deg,#232526,#3A3A42)', icon:'bottle'},
  {gradient:'linear-gradient(135deg,#D8D2C4,#B7AF9C)', icon:'bottle'},
  {gradient:'linear-gradient(135deg,#FBD3E9,#F6A6C1)', icon:'blush'},
  {gradient:'linear-gradient(135deg,#6D4C41,#3E2723)', icon:'wand'},
  {gradient:'linear-gradient(135deg,#C2185B,#880E4F)', icon:'lip'},
  {gradient:'linear-gradient(135deg,#FFD6E8,#FFB6C1)', icon:'blush'}
];
function fallbackVisual(p){
  const seed = String((p && (p.id || p.name)) || 'x').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  return FALLBACK_PALETTE[seed % FALLBACK_PALETTE.length];
}

// Convierte "HH:MM" (24h) a "h:mm a. m./p. m." para mostrarlo igual que antes.
function formatHora12(hhmm){
  if(!hhmm || typeof hhmm !== 'string' || !hhmm.includes(':')) return '';
  const [hStr,mStr] = hhmm.split(':');
  let h = parseInt(hStr,10), m = parseInt(mStr,10);
  if(isNaN(h) || isNaN(m)) return '';
  const suf = h >= 12 ? 'p. m.' : 'a. m.';
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${String(m).padStart(2,'0')} ${suf}`;
}
function formatHoursRange(desde,hasta){
  const a = formatHora12(desde), b = formatHora12(hasta);
  if(!a || !b) return '';
  return `${a} - ${b}`;
}
// ¿Está abierto ahora mismo según el horario configurado? Soporta horarios que cruzan medianoche.
function computeIsOpen(desde,hasta){
  if(!desde || !hasta) return true; // sin horario configurado: no bloqueamos la tienda
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const [dh,dm] = desde.split(':').map(Number);
  const [hh,hm] = hasta.split(':').map(Number);
  if([dh,dm,hh,hm].some(isNaN)) return true;
  const startMin = dh*60+dm, endMin = hh*60+hm;
  if(startMin === endMin) return true;
  if(startMin < endMin) return nowMin >= startMin && nowMin < endMin;
  return nowMin >= startMin || nowMin < endMin; // cruza medianoche
}

function normalizeIncomingProduct(raw){
  if(!raw || typeof raw !== 'object') return null;
  if(raw.id === undefined || raw.id === null || raw.name === undefined) return null;
  const price = Number(raw.price); 
  const priceMax = raw.priceMax !== undefined && raw.priceMax !== null ? Number(raw.priceMax) : null;
  const visual = fallbackVisual(raw);
  const hasVariants = !!raw.hasVariants;
  const variantGroups = hasVariants && Array.isArray(raw.variantGroups) ? raw.variantGroups.map(g => ({
    name: (g && g.name) || '',
    options: (g && Array.isArray(g.options)) ? g.options.map(o => ({
      option: (o && o.option) || '',
      price: Number(o && o.price) || 0,
      available: !(o && o.available === false)
    })) : []
  })).filter(g => g.options.length > 0) : [];
  return {
    id: String(raw.id),
    name: String(raw.name || '').trim() || 'Producto sin nombre',
    price: isNaN(price) ? 0 : price,
    priceMax: (priceMax !== null && !isNaN(priceMax) && priceMax > price) ? priceMax : null,
    hasVariants: hasVariants && variantGroups.length > 0,
    variantGroups: variantGroups,
    category: (raw.category && String(raw.category).trim()) || 'Otros',
    desc: raw.description || raw.desc || '',
    image: raw.image || '',
    images: (Array.isArray(raw.images) && raw.images.filter(Boolean).length) ? raw.images.filter(Boolean).slice(0,3) : (raw.image ? [raw.image] : []),
    gradient: visual.gradient,
    icon: visual.icon,
    available: raw.available !== false
  };
}

// CARRITO POR VARIANTE
// ----------------------------------------------------------------------------
// Un producto sin variantes usa su id tal cual como llave del carrito ("1001").
// Un producto CON variantes usa una llave compuesta ("1002::0:1" = producto 1002,
// grupo 0, opción 1) para que cada variante (Talla, Color, etc.) sea una línea
// aparte del carrito, con su propio precio y disponibilidad.
function makeCartKey(productId, groupIndex, optionIndex){
  return (groupIndex === null || groupIndex === undefined) ? String(productId) : `${productId}::${groupIndex}:${optionIndex}`;
}
function parseCartKey(key){
  const idx = key.indexOf('::');
  if(idx === -1) return { productId: key, groupIndex: null, optionIndex: null };
  const productId = key.slice(0, idx);
  const parts = key.slice(idx+2).split(':');
  return { productId, groupIndex: Number(parts[0]), optionIndex: Number(parts[1]) };
}
// Resuelve una llave del carrito contra los productos actuales: producto, variante elegida
// (si aplica), nombre para mostrar, precio y si todavía está disponible.
function getCartLineInfo(key){
  const { productId, groupIndex, optionIndex } = parseCartKey(key);
  const p = getProduct(productId);
  if(!p) return null;
  if(groupIndex === null || groupIndex === undefined || !p.variantGroups || !p.variantGroups[groupIndex]){
    return { product:p, label:p.name, price:p.price, available:p.available, groupIndex:null, optionIndex:null, optionName:null, groupName:null };
  }
  const group = p.variantGroups[groupIndex];
  const opt = group.options[optionIndex];
  if(!opt) return { product:p, label:p.name, price:p.price, available:false, groupIndex, optionIndex, optionName:null, groupName:group.name };
  return { product:p, label:`${p.name} (${opt.option})`, price:opt.price, available:(opt.available !== false) && p.available !== false, groupIndex, optionIndex, optionName:opt.option, groupName:group.name };
}
// Todas las opciones de un producto, aplanadas en una sola lista para el selector del
// detalle (con el nombre del grupo si el producto tiene más de uno).
function flatVariantOptions(p){
  if(!p || !p.variantGroups) return [];
  const out = [];
  p.variantGroups.forEach((g, gIdx) => {
    (g.options||[]).forEach((o, oIdx) => {
      out.push({ groupIndex:gIdx, optionIndex:oIdx, groupName:g.name, optionName:o.option, price:o.price, available:o.available !== false });
    });
  });
  return out;
}

// Quita del carrito cualquier producto que ya no exista o que el negocio haya ocultado,
// para que nunca truene por un id "huérfano" (ej: si se desactivó "Mostrar en tienda virtual").
function pruneCartAgainstProducts(){
  let changed = false;
  Object.keys(state.cart).forEach(key => {
    if(!getCartLineInfo(key)){ delete state.cart[key]; changed = true; }
  });
  if(changed) saveCart();
}

// Trae el catálogo y los datos del negocio desde Supabase. Devuelve true si algo cambió.
// Si no hay conexión o Supabase falla, usa la última copia que este teléfono guardó (si hay),
// para que el catálogo no se quede en blanco por un problema momentáneo de señal.
async function loadFromBridge(){
  if(!sbClient) return loadFromCachedBridge();
  let bizRows, prodRows;
  try{
    const [bizRes, prodRes] = await Promise.all([
      sbClient.from('catalog_business').select('*').limit(1),
      sbClient.from('catalog_products').select('*')
    ]);
    if(bizRes.error) throw bizRes.error;
    if(prodRes.error) throw prodRes.error;
    bizRows = bizRes.data; prodRows = prodRes.data;
  }catch(e){
    console.warn('No se pudo conectar con la tienda en línea, se usa la última copia guardada.', e);
    return loadFromCachedBridge();
  }
  const biz = (bizRows && bizRows[0]) || {};
  const data = {
    business: {
      nombre: biz.nombre || '', logo: biz.logo || '',
      recogerTienda: !!biz.recoger_tienda, entregaDomicilio: !!biz.entrega_domicilio,
      horarioDesde: biz.horario_desde || '', horarioHasta: biz.horario_hasta || ''
    },
    products: (prodRows || []).map(r => ({
      id: r.id, name: r.name, description: r.description, category: r.category,
      image: r.image, images: r.images, price: r.price, priceMax: r.price_max,
      hasVariants: r.has_variants, available: r.available, variantGroups: r.variant_groups
    }))
  };
  const comparable = JSON.stringify(data);
  if(comparable === lastBridgeRaw) return false;
  lastBridgeRaw = comparable;
  applyBridgeData(data);
  try{ localStorage.setItem(BRIDGE_KEY, comparable); }catch(e){} // copia de respaldo por si luego falla la red
  return true;
}

// Respaldo sin conexión: la última copia buena que se guardó en ESTE teléfono.
function loadFromCachedBridge(){
  let raw = null;
  try{ raw = localStorage.getItem(BRIDGE_KEY); }catch(e){ return false; }
  if(!raw || raw === lastBridgeRaw) return false;
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return false; }
  lastBridgeRaw = raw;
  applyBridgeData(data);
  return true;
}

function applyBridgeData(data){
  if(!data || typeof data !== 'object') return;
  if(data.business && typeof data.business === 'object'){
    const b = data.business;
    STORE.name = (b.nombre && String(b.nombre).trim()) || STORE.name;
    STORE.logo = b.logo || '';
    STORE.recogerTienda = !!b.recogerTienda;
    STORE.entregaDomicilio = !!b.entregaDomicilio;
    STORE.horarioDesde = b.horarioDesde || '';
    STORE.horarioHasta = b.horarioHasta || '';
    STORE.hours = formatHoursRange(STORE.horarioDesde, STORE.horarioHasta);
    STORE.open = computeIsOpen(STORE.horarioDesde, STORE.horarioHasta);
  }
  if(Array.isArray(data.products)){
    PRODUCTS = data.products.map(normalizeIncomingProduct).filter(Boolean);
  }
}

function getCats(){
  return ['Todos', ...Array.from(new Set(PRODUCTS.map(p=>p.category)))];
}
// Si la categoría activa ya no existe (el producto se ocultó/eliminó), volvemos a "Todos".
function ensureValidActiveCategory(){
  if(state.activeCategory !== 'Todos' && !PRODUCTS.some(p=>p.category===state.activeCategory)){
    state.activeCategory = 'Todos';
  }
}
function deliveryMethodsAvailable(){
  const methods = [];
  if(STORE.entregaDomicilio) methods.push('domicilio');
  if(STORE.recogerTienda) methods.push('recoger');
  if(methods.length === 0) methods.push('domicilio'); // reserva: evita un checkout sin ninguna opción
  return methods;
}
function ensureValidDelivery(){
  const methods = deliveryMethodsAvailable();
  if(!methods.includes(state.delivery)) state.delivery = methods[0];
}

/* ============ HELPERS ============ */
function fmt(n){ n = Number(n); if(isNaN(n)) n = 0; return '$' + n.toFixed(2).replace(/\.?0+$/,''); }
function priceLabel(p){ if(!p) return fmt(0); return p.priceMax ? `Desde ${fmt(p.price)}` : fmt(p.price); }
function cartCount(){ return Object.entries(state.cart).reduce((a,[key,qty])=> getCartLineInfo(key) ? a+qty : a, 0); }
function cartTotal(){ return Object.entries(state.cart).reduce((sum,[key,qty])=>{ const info=getCartLineInfo(key); return sum+(info?info.price*qty:0); },0); }
function getProduct(id){ return PRODUCTS.find(p=>p.id===String(id)); }
function filteredProducts(){
  const q = state.search.trim().toLowerCase();
  let list = PRODUCTS.filter(p => (state.activeCategory==='Todos'||p.category===state.activeCategory) && p.name.toLowerCase().includes(q));
  if(state.sortMode==='az') list = [...list].sort((a,b)=>a.name.localeCompare(b.name));
  if(state.sortMode==='lowhigh') list = [...list].sort((a,b)=>a.price-b.price);
  if(state.sortMode==='highlow') list = [...list].sort((a,b)=>b.price-a.price);
  return list;
}

/* ============ ACTIONS ============ */
let suppressHistoryPush = false;
// historyDepth tracks how many "steps" the current view is from the root catalog.
// This lets us collapse back to the root in a single jump (history.go(-historyDepth))
// instead of piling up phantom screens that the phone's back button would later resurface.
let historyDepth = 0;
let pendingAfterPop = null;

function go(view){
  state.view=view; state.sortOpen=false; window.scrollTo(0,0);
  if(!suppressHistoryPush){
    historyDepth++;
    history.pushState({view:view, detailId:state.detailId, depth:historyDepth}, '', '#'+view);
  }
  render();
}
// Use for actions that logically FINISH a flow (e.g. an order was placed) rather than
// drilling further in. Collapses all the intermediate screens (detail/cart/checkout...)
// out of the history stack in one shot, then optionally runs `after` (e.g. to push the
// next screen on top of a clean root) so the back button can't land on stale screens.
function resetToRoot(after){
  if(historyDepth===0){ if(after) after(); return; }
  pendingAfterPop = after || null;
  history.go(-historyDepth);
}
window.addEventListener('popstate', function(e){
  suppressHistoryPush = true;
  if(e.state && e.state.view){
    state.view = e.state.view;
    historyDepth = e.state.depth || 0;
    if(typeof e.state.detailId !== 'undefined') state.detailId = e.state.detailId;
  } else {
    state.view = 'catalog';
    historyDepth = 0;
  }
  state.sortOpen = false;
  window.scrollTo(0,0);
  render();
  suppressHistoryPush = false;
  if(pendingAfterPop){
    const fn = pendingAfterPop;
    pendingAfterPop = null;
    fn();
  }
});
history.replaceState({view:'catalog', detailId:null, depth:0}, '', '#catalog');
function openDetail(id){
  state.detailId=id; state.detailQty=1; state.detailImgIndex=0;
  const p = getProduct(id);
  const opts = flatVariantOptions(p);
  const firstAvailable = opts.find(o => o.available);
  state.detailVariant = firstAvailable ? { groupIndex:firstAvailable.groupIndex, optionIndex:firstAvailable.optionIndex } : null;
  go('detail');
}
function chooseDetailVariant(groupIndex, optionIndex){ state.detailVariant = { groupIndex, optionIndex }; state.detailQty = 1; render(); }
function quickAdd(id, ev){
  ev.stopPropagation();
  const p=getProduct(id);
  if(!p || !p.available) return;
  if(p.hasVariants){ openDetail(id); return; } // hay que elegir la variante primero
  state.cart[id]=(state.cart[id]||0)+1; saveCart(); render();
}
function changeDetailQty(d){ state.detailQty=Math.max(1,state.detailQty+d); render(); }
function setDetailImg(i){ state.detailImgIndex=i; render(); }
function confirmAddDetail(){
  const id=state.detailId; const p=getProduct(id);
  if(!p || !p.available) return;
  let key = id;
  if(p.hasVariants){
    if(!state.detailVariant) return; // no debería pasar: el botón está deshabilitado sin selección
    const group = p.variantGroups[state.detailVariant.groupIndex];
    const opt = group && group.options[state.detailVariant.optionIndex];
    if(!opt || opt.available === false) return;
    key = makeCartKey(id, state.detailVariant.groupIndex, state.detailVariant.optionIndex);
  }
  state.cart[key]=(state.cart[key]||0)+state.detailQty; saveCart(); history.back();
}
function toggleListMode(v){ state.listMode=v; render(); }
function setCategory(c){ state.activeCategory=c; render(); }
function onSearch(v){
  state.search=v;
  const prevInput = document.querySelector('.search-wrap input');
  const caret = prevInput ? prevInput.selectionStart : null;
  render();
  const newInput = document.querySelector('.search-wrap input');
  if(newInput){
    newInput.focus();
    const pos = caret===null ? newInput.value.length : caret;
    try{ newInput.setSelectionRange(pos,pos); }catch(e){}
  }
}
function toggleSort(){ state.sortOpen=!state.sortOpen; render(); }
function setSort(m){ state.sortMode=m; state.sortOpen=false; render(); }
function changeCartQty(id,d){ const q=(state.cart[id]||0)+d; if(q<=0) delete state.cart[id]; else state.cart[id]=q; saveCart(); render(); }
function clearCart(){ state.cart={}; saveCart(); render(); }
function selectDelivery(m){ if(!deliveryMethodsAvailable().includes(m)) return; state.delivery=m; render(); }
function updateField(k,v){ state.form[k]=v; if(state.errors[k]) delete state.errors[k]; }
function submitOrder(){
  if(cartCount()===0) return; // carrito vacío (p. ej. el cliente quitó todo en el resumen)
  const errs={};
  if(!state.form.nombre.trim()) errs.nombre=1;
  if(!state.form.celular.trim()) errs.celular=1;
  if(!state.form.direccion.trim()) errs.direccion=1;
  state.errors=errs;
  if(Object.keys(errs).length){ render(); return; }
  if(state.submitting) return; // evita doble envío si el cliente toca el botón dos veces
  state.submitting = true; render();
  const pedido = construirPedidoDesdeCarrito();
  enviarPedidoAAppPrincipal(pedido).then(enviado => {
    state.submitting = false;
    state.lastOrder = {
      items:{...state.cart}, total:cartTotal(), form:{...state.form}, delivery:state.delivery,
      syncFailed: !enviado,
      whatsappFallbackUrl: !enviado ? ('https://wa.me/' + STORE.whatsapp + '?text=' + encodeURIComponent(buildWhatsAppOrderMessage(pedido))) : null
    };
    state.cart={}; saveCart();
    resetToRoot(function(){ go('confirmation'); });
  });
}

function construirPedidoDesdeCarrito(){
  const items = Object.keys(state.cart).map(key => {
    const info = getCartLineInfo(key);
    const { productId } = parseCartKey(key);
    return {
      productId: productId,
      name: info ? info.product.name : '(producto ya no disponible)',
      qty: state.cart[key],
      price: info ? info.price : 0,
      groupName: info ? info.groupName : null,
      optionName: info ? info.optionName : null
    };
  });
  return {
    id: 'pedido_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    createdAt: Date.now(),
    cliente: {
      nombre: state.form.nombre.trim(),
      celular: state.form.celular.trim(),
      direccion: state.form.direccion.trim(),
      comentarios: (state.form.comentarios || '').trim()
    },
    delivery: state.delivery,
    total: cartTotal(),
    items: items
  };
}

// Redacta el pedido como mensaje de WhatsApp, por si justo en el momento de enviar no
// hay señal para avisarle a la app madre: así el pedido no se pierde, el cliente lo
// confirma directo con el negocio y con todo el detalle ya escrito.
function buildWhatsAppOrderMessage(pedido){
  const lineas = pedido.items.map(it => `• ${it.qty} x ${it.name}${it.optionName ? ' ('+it.optionName+')' : ''}`).join('\n');
  const entrega = pedido.delivery === 'recoger' ? 'Recoger en tienda' : 'Entrega a domicilio';
  return `Hola! Quiero confirmar este pedido que intenté enviar desde el catálogo:\n\n${lineas}\n\nTotal: ${fmt(pedido.total)}\n${entrega}\nNombre: ${pedido.cliente.nombre}\nCelular: ${pedido.cliente.celular}\nDirección: ${pedido.cliente.direccion}${pedido.cliente.comentarios ? '\nComentarios: '+pedido.cliente.comentarios : ''}`;
}

// Manda el pedido a Supabase, donde la app madre lo detecta y genera una notificación con
// estos datos para que el administrador solo tenga que completar la venta. Devuelve true si
// se guardó correctamente.
async function enviarPedidoAAppPrincipal(pedido){
  if(sbClient){
    try{
      const { error } = await sbClient.from('pedidos_web').insert({ id: pedido.id, data: pedido });
      if(!error) return true;
      console.warn('No se pudo enviar el pedido a la tienda.', error);
    }catch(e){
      console.warn('No se pudo enviar el pedido a la tienda.', e);
    }
  }
  return false;
}

/* ============ RENDER PIECES ============ */
function swatch(cls, p, extra){
  extra = extra || '';
  if(!p) return `<div class="${cls}"></div>`;
  if(p.image) return `<div class="${cls}">${extra}<img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy"></div>`;
  return `<div class="${cls}" style="background:${p.gradient}">${extra}${ICONS[p.icon] || ICONS.bottle}</div>`;
}
// Cuántas unidades hay en el carrito de este producto, sumando TODAS sus variantes
// (cada variante es una línea de carrito distinta, ver makeCartKey/parseCartKey).
function cartQtyForProduct(productId){
  return Object.entries(state.cart).reduce((sum,[key,qty]) => parseCartKey(key).productId === String(productId) ? sum+qty : sum, 0);
}
function addButtonHtml(p){
  if(!p.available) return `<span class="add-btn agotado">Agotado</span>`;
  const inCart = cartQtyForProduct(p.id);
  const smallCart = ICONS.cart.replace('width="24" height="24"','width="16" height="16"');
  // Con variantes, siempre se abre el detalle para elegir cuál (no se puede sumar "a ciegas").
  const action = p.hasVariants ? `openDetail('${p.id}')` : `quickAdd('${p.id}',event)`;
  return inCart
    ? `<button class="add-btn in-cart" onclick="${action}">${smallCart}${inCart}</button>`
    : `<button class="add-btn" onclick="${action}">${ICONS.plus}</button>`;
}
function productCardGrid(p){
  const badge = p.available ? `<span class="badge-pill">Disponible</span>` : `<span class="badge-pill off">Agotado</span>`;
  return `<div class="card ${p.available?'':'is-agotado'}" onclick="openDetail('${p.id}')">
    ${swatch('card-img',p,badge)}
    <div class="card-body">
      <div class="card-cat">${escapeHtml(p.category)}</div>
      <div class="card-title">${escapeHtml(p.name)}</div>
      <div class="card-bottom">
        <span class="price">${priceLabel(p)}</span>
        ${addButtonHtml(p)}
      </div>
    </div>
  </div>`;
}
function productCardList(p){
  return `<div class="list-card ${p.available?'':'is-agotado'}" onclick="openDetail('${p.id}')">
    ${swatch('list-img',p)}
    <div class="list-info">
      <div class="list-title">${escapeHtml(p.name)}</div>

    </div>

}

function renderDetail(){
  const p = getProduct(state.detailId);
  if(!p) return renderCatalog();

  const imgs = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
  const activeIdx = Math.min(state.detailImgIndex || 0, Math.max(imgs.length - 1, 0));
  const mainImg = imgs[activeIdx];
  const mainProduct = mainImg ? { ...p, image: mainImg } : p;

  // Si el producto tiene variantes (Talla, Color, etc.), el cliente tiene que elegir una
  // opción específica antes de poder agregarla: así la venta llega ya identificada y el
  // administrador no tiene que adivinar cuál quería.
  const selectedGroup = (p.hasVariants && state.detailVariant) ? p.variantGroups[state.detailVariant.groupIndex] : null;
  const selectedOpt = selectedGroup ? selectedGroup.options[state.detailVariant.optionIndex] : null;
  const effectivePrice = selectedOpt ? selectedOpt.price : p.price;
  const canAdd = p.available && (!p.hasVariants || (!!selectedOpt && selectedOpt.available !== false));

  const variantPicker = p.hasVariants ? p.variantGroups.map((g, gIdx) => `

        return `<button type="button" class="variant-pill ${isSelected?'selected':''} ${isAvailable?'':'disabled'}" ${isAvailable?`onclick="chooseDetailVariant(${gIdx},${oIdx})"`:'disabled'}>${escapeHtml(o.option)}${!isAvailable?' · Agotado':''}</button>`;

/* ============ MAIN RENDER ============ */
let __lastRenderedView = null;
function render(){
  const prevY = window.scrollY, sameView = (__lastRenderedView === state.view);
  document.body.className = 'view-' + state.view;
  const app = document.getElementById('app');
  try{
    if(state.view==='catalog') app.innerHTML = renderCatalog();
    else if(state.view==='detail') app.innerHTML = renderDetail();
    else if(state.view==='cart') app.innerHTML = renderCart();
    else if(state.view==='checkout') app.innerHTML = renderCheckout();
    else if(state.view==='confirmation') app.innerHTML = renderConfirmation();
  }catch(err){
    // Nunca dejamos la pantalla en blanco por un dato inesperado del inventario:
    // mostramos algo utilizable y seguimos vivos.
    console.error('Error al mostrar el catálogo', err);
    app.innerHTML = `<div class="empty-state">${ICONS.emptyCart}<p>Ocurrió un problema mostrando el catálogo. Desliza para actualizar o vuelve a intentarlo.</p></div>`;
  }
  // Al volver a dibujar la MISMA pantalla (sumar/quitar productos, cambiar filtro, etc.) se
  // conserva el punto donde estaba el cliente en vez de saltar al inicio.
  __lastRenderedView = state.view;
  if(sameView) window.scrollTo(0, prevY);
}

/* ============================================================================
   CONEXIÓN EN VIVO CON LA APP MADRE
   Cada vez que la app madre guarda datos nuevos en la llave puente, esta
   pestaña los recoge y se re-renderiza sola, sin que el cliente tenga que
   recargar la página. Se combinan varias señales porque, según el navegador,
   alguna puede no dispararse:
   - 'storage': se dispara en OTRAS pestañas/ventanas cuando localStorage cambia.
   - visibilitychange/focus: cubre volver a esta pestaña tras estar en segundo plano.
   - un intervalo corto: red de seguridad si ninguna de las anteriores aplica
     (por ejemplo, vistas dentro de un mismo WebView sin eventos de pestaña).
   ============================================================================ */
// Si el cliente está escribiendo en un campo (nombre, celular, dirección...), redibujar la pantalla
// cerraría el teclado. En ese caso se pospone el redibujado hasta que termine de escribir.
let pendingRender = false;
function isTypingInForm(){
  const el = document.activeElement;
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && el.closest('#app') && !el.closest('.search-wrap'));
}
async function refreshCatalogData(){
  const changed = await loadFromBridge();
  if(changed){
    pruneCartAgainstProducts();
    ensureValidActiveCategory();
    ensureValidDelivery();
    if(isTypingInForm()){ pendingRender = true; return; }
    render();
  }
}
document.addEventListener('focusout', () => {
  if(!pendingRender) return;
  setTimeout(() => { if(pendingRender && !isTypingInForm()){ pendingRender = false; render(); } }, 250);
});

(async function initCatalog(){
  await loadFromBridge();
  pruneCartAgainstProducts();
  render();
})();

window.addEventListener('storage', (e) => { if(!e.key || e.key === BRIDGE_KEY) refreshCatalogData(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshCatalogData(); });
window.addEventListener('focus', refreshCatalogData);
// Antes eran 3s: como ahora cada revisión es una consulta de red a Supabase (y no una
// lectura instantánea de localStorage), se espacía más para no gastar la cuota de la
// cuenta gratis ni la señal del cliente sin necesidad.
setInterval(refreshCatalogData, 8000);
</script>
</body>
</html>
